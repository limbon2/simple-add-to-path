[package]
name = "add-to-path"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The DLL is the Windows 11 menu command. The exe does the work for both menus.
[lib]
name = "add_to_path_ext"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "add-to-path"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true
